name: Create MyAchievements Signing Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore myachievements-release.jks \
            -alias myachievements \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MyAchievementsStore2026! \
            -keypass MyAchievementsKey2026! \
            -dname "CN=MyAchievements, OU=App, O=MyAchievements, L=Unknown, ST=Unknown, C=FR"

      - name: Encode keystore
        run: |
          base64 -w 0 myachievements-release.jks > myachievements-release.base64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: MyAchievements-signing-keystore
          path: |
            myachievements-release.jks
            myachievements-release.base64
